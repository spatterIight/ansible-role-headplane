---
# Project source code URL: https://github.com/tale/headplane

headplane_enabled: true

headplane_identifier: headplane
headplane_base_path: "/{{ headplane_identifier }}"
headplane_data_path: "{{ headplane_base_path }}/data"

# renovate: datasource=docker depName=ghcr.io/tale/headplane versioning=semver
headplane_version: 0.7.1

headplane_uid: ""
headplane_gid: ""

headplane_arch: amd64

# The scheme used for serving Headplane.
# Set this to the browser-facing scheme, including when TLS terminates at an external proxy.
# Configure Traefik entrypoints and TLS separately to match how Headplane is exposed.
headplane_scheme: https

# The hostname at which headplane is served.
headplane_hostname: ""

# The path at which headplane is served.
# This value must either be `/` or not end with a slash (e.g. `/headplane`).
headplane_path_prefix: /

headplane_container_image: "{{ headplane_container_image_registry_prefix }}tale/headplane:{{ headplane_container_image_tag }}"
headplane_container_image_tag: "{{ headplane_version }}"
headplane_container_image_registry_prefix: "{{ headplane_container_image_registry_prefix_upstream }}"
headplane_container_image_registry_prefix_upstream: "{{ headplane_container_image_registry_prefix_upstream_default }}"
headplane_container_image_registry_prefix_upstream_default: ghcr.io/

# The base container network. It will be auto-created by this role if it doesn't exist already.
headplane_container_network: "{{ headplane_identifier }}"

# Control if the container network is deleted on uninstalling.
headplane_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port for the Web UI (as defined by `headplane_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
headplane_container_http_bind_port: ""

# The port number in the container
headplane_container_http_port: 3000

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
headplane_container_additional_networks: "{{ (headplane_container_additional_networks_default + headplane_container_additional_networks_auto + headplane_container_additional_networks_custom) | unique }}"
headplane_container_additional_networks_default: []
headplane_container_additional_networks_auto: []
headplane_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
headplane_container_additional_volumes: "{{ headplane_container_additional_volumes_auto + headplane_container_additional_volumes_custom }}"
headplane_container_additional_volumes_auto: []
headplane_container_additional_volumes_custom: []

# headplane_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `headplane_container_labels_additional_labels_custom`.
headplane_container_labels_traefik_enabled: true
headplane_container_labels_traefik_docker_network: "{{ headplane_container_network }}"
headplane_container_labels_traefik_hostname: "{{ headplane_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/headplane`).
headplane_container_labels_traefik_path_prefix: "{{ headplane_path_prefix }}"
headplane_container_labels_traefik_rule: "Host(`{{ headplane_container_labels_traefik_hostname }}`){% if headplane_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ headplane_container_labels_traefik_path_prefix }}`){% endif %}"
headplane_container_labels_traefik_priority: 0
headplane_container_labels_traefik_entrypoints: web-secure
headplane_container_labels_traefik_tls: "{{ headplane_container_labels_traefik_entrypoints != 'web' }}"
headplane_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls the addition of a set of Traefik labels
# which automatically redirect to /admin when `headplane_path_prefix` is '/'
headplane_container_labels_traefik_automatically_redirect_to_admin: true

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `headplane_container_labels_traefik_additional_request_headers_custom`
headplane_container_labels_traefik_additional_request_headers: "{{ headplane_container_labels_traefik_additional_request_headers_auto | combine(headplane_container_labels_traefik_additional_request_headers_custom) }}"
headplane_container_labels_traefik_additional_request_headers_auto: {}
headplane_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `headplane_container_labels_traefik_additional_response_headers_custom`
headplane_container_labels_traefik_additional_response_headers: "{{ headplane_container_labels_traefik_additional_response_headers_auto | combine(headplane_container_labels_traefik_additional_response_headers_custom) }}"
headplane_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': headplane_http_header_xss_protection} if headplane_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': headplane_http_header_content_type_options} if headplane_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': headplane_http_header_content_security_policy} if headplane_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': headplane_http_header_permissions_policy} if headplane_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': headplane_http_header_strict_transport_security} if headplane_http_header_strict_transport_security and headplane_container_labels_traefik_tls else {})
  }}
headplane_container_labels_traefik_additional_response_headers_custom: {}

# headplane_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `headplane_container_labels_additional_labels_custom`
#
# Example:
# headplane_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
headplane_container_labels_additional_labels: "{{ headplane_container_labels_additional_labels_auto + headplane_container_labels_additional_labels_custom }}"
headplane_container_labels_additional_labels_auto: []
headplane_container_labels_additional_labels_custom: []

# A list of extra arguments to pass to the container (`docker create` command)
headplane_container_extra_arguments: "{{ headplane_container_extra_arguments_auto + headplane_container_extra_arguments_custom }}"
headplane_container_extra_arguments_auto: []
headplane_container_extra_arguments_custom: []

# A list of extra arguments to pass to the process inside the container
# Example: ['--SOME_ARGUMENT']
headplane_process_extra_arguments: "{{ headplane_process_extra_arguments_auto + headplane_process_extra_arguments_custom }}"
headplane_process_extra_arguments_auto: []
headplane_process_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
headplane_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
headplane_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
headplane_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
headplane_http_header_permissions_policy: "{{ 'interest-cohort=()' if headplane_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
headplane_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if headplane_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `headplane_http_header_permissions_policy`
headplane_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `headplane_http_header_strict_transport_security`
headplane_hsts_preload_enabled: false

# List of systemd services that the Headplane systemd service depends on
headplane_systemd_required_services_list: "{{ (headplane_systemd_required_services_list_default + headplane_systemd_required_services_list_auto + headplane_systemd_required_services_list_custom) | unique }}"
headplane_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
headplane_systemd_required_services_list_auto: []
headplane_systemd_required_services_list_custom: []

# List of systemd services that the Headplane systemd service wants
headplane_systemd_wanted_services_list: "{{ (headplane_systemd_wanted_services_list_default + headplane_systemd_wanted_services_list_auto + headplane_systemd_wanted_services_list_custom) | unique }}"
headplane_systemd_wanted_services_list_default: []
headplane_systemd_wanted_services_list_auto: []
headplane_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
headplane_container_stop_grace_time_seconds: "{{ devture_systemd_docker_base_container_stop_grace_time_seconds }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
headplane_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
headplane_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
headplane_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ headplane_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ headplane_container_stop_grace_time_seconds }} {{ headplane_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ headplane_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ headplane_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ headplane_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ headplane_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ headplane_identifier }} after {{ headplane_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Controls the `integration.docker.socket` configuration value
# and the mounting of `headplane_config_integration_docker_endpoint` into the container
headplane_config_integration_docker_endpoint: ""

# Controls the mounting of `headplane_config_integration_docker_endpoint` into the container
headplane_docker_endpoint_is_unix_socket: false

# The public URL of Headplane, used to construct OIDC callback URLs.
# Do not include the dashboard prefix (/admin).
headplane_config_server_base_url: "{{ headplane_scheme }}://{{ headplane_hostname }}"

# Whether session cookies require HTTPS, based on the browser-facing URL.
headplane_config_server_cookie_secure: "{{ (headplane_config_server_base_url | urlsplit('scheme')) != 'http' }}"

# The secret used to encode and decode web sessions
# Ensure that this is exactly 32 characters long
#
# Generate with `pwgen -s 32 1` or in another way
headplane_cookie_secret: ""

# The public URL at which headscale is served
headplane_headscale_public_url: ""

# Controls the `HEADPLANE_DEBUG_LOG=true` environment variable being set
headplane_debugging_enabled: false

# The name of the headscale docker container,
# useful if enabling docker integration
headplane_headscale_container_name: headscale

# Controls the headscale.dns_records_path configuration
headplane_headscale_extra_records_enabled: false

# The hostname at which headscale is served
headplane_headscale_hostname: headscale
headplane_headscale_port: 8080

# The path at which the headscale configuration file is stored outside of the container
# Set to an empty string to not mount
headplane_headscale_config_path: ""

# Control options for the mounting of `headplane_headscale_config_path`
# Defaults to 'readonly', which is more secure but disables changes to DNS
#
# Set `headplane_headscale_config_path_mount_options` to 'readwrite' to mount as read-write
headplane_headscale_config_path_mount_options: readonly

# Controls the `integration.agent.tailscale_netns` configuration value
headplane_config_integration_agent_tailscale_netns: true

# Controls the `integration.agent.enabled` configuration value
headplane_config_integration_agent_enabled: false

# Controls the `headscale.api_key` configuration value through the protected environment file.
# This is required when `headplane_config_integration_agent_enabled` is enabled.
headplane_config_headscale_api_key: ""

# Controls the `integration.docker.enabled` configuration value
# and the mounting of `headplane_config_integration_docker_endpoint` into the container
headplane_config_integration_docker_enabled: false

# Default Headplane configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `headplane_configuration_extension_yaml`)
# or completely replace this variable with your own template.
headplane_configuration_yaml: "{{ lookup('template', 'templates/config.yaml.j2') }}"

headplane_configuration_extension_yaml: |
  # Your custom YAML configuration for Headplane goes here.
  # This configuration extends the default starting configuration (`headplane_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `headplane_configuration_yaml`.
  #
  # Example configuration extension follows:
  #
  # acme_url: https://acme-v02.api.letsencrypt.org/directory
  # acme_email: "alice@example.com"

headplane_configuration_extension: "{{ headplane_configuration_extension_yaml | from_yaml if headplane_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final Headplane configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `headplane_configuration_yaml`.
headplane_configuration: "{{ headplane_configuration_yaml | from_yaml | combine(headplane_configuration_extension, recursive=true) }}"

# headplane_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# headplane_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
headplane_environment_variables_additional_variables: ""

# headplane_restart_necessary controls whether the Headplane systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
headplane_restart_necessary: false
