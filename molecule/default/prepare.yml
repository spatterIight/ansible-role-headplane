---
- name: Prepare Headplane Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Headplane Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Headplane Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for Headplane Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The Headplane image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    # Bind-mounted into the Headplane container through
    # `headplane_container_additional_volumes_custom`. The role does not create the
    # source of an additional volume, so it has to exist before the container
    # is created, or `docker create` refuses the bind.
    - name: Ensure Headplane Molecule extra volume directory exists
      ansible.builtin.file:
        path: "{{ headplane_molecule_extra_volume_src }}"
        state: directory
        mode: "0755"
