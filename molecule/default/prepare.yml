---
- name: Prepare Headplane Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Headplane Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Headplane Molecule tests preparation
      ansible.builtin.package:
        name:
          # `fuse-overlayfs` is the storage driver the inner Docker daemon uses below.
          # `vfs` also works, but copies the whole image on every layer, which makes
          # the job several times slower - and this scenario pulls two images.
          - fuse-overlayfs
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Headplane Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: fuse-overlayfs

    # Bind-mounted into the Headplane container through
    # `headplane_container_additional_volumes`. The role does not create the
    # source of an additional volume, so it has to exist before the container
    # is created, or `docker create` refuses the bind.
    - name: Ensure Headplane Molecule extra volume directory exists
      ansible.builtin.file:
        path: "{{ headplane_molecule_extra_volume_host_path }}"
        state: directory
        mode: "0755"
