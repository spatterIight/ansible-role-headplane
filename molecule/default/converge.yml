---
- name: Include roles for Headplane Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # `ansible-role-headscale` is installed first, so that its container
    # network exists by the time the Headplane systemd unit tries to connect
    # its own container to it.
    - name: Include roles for Headplane Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-headscale
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Headscale and Headplane services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Headscale systemd service is started
      ansible.builtin.systemd_service:
        name: headscale.service
        state: started

    - name: Ensure Headplane systemd service is started
      ansible.builtin.systemd_service:
        name: headplane.service
        state: started
